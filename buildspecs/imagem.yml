# =====================================================================
# Portão 3 - Imagem: build, varredura com Trivy e push no ECR
# Projeto CodeBuild: ovitrampas-imagem  (modo PRIVILEGIADO ligado)
# Variáveis de ambiente do projeto (configuradas no console):
#   ECR_REPOSITORY_URI  ex.: 123456789012.dkr.ecr.us-east-2.amazonaws.com/ovitrampas-api
#   CONTAINER_NAME      nome do contêiner na task definition: api
#
# Saída: imagedefinitions.json, que a ação de deploy do ECS lê para saber
# qual imagem nova colocar no ar.
# =====================================================================
version: 0.2

phases:
  install:
    commands:
      # Versão FIXA do Trivy (a mesma do kit da Aula 14).
      - curl -sSL https://github.com/aquasecurity/trivy/releases/download/v0.76.1/trivy_0.76.1_Linux-64bit.tar.gz | tar xz -C /usr/local/bin trivy

  pre_build:
    commands:
      # A etiqueta (tag) da imagem é o início do SHA do commit: olhando o
      # service no ECS, dá para saber exatamente qual código está rodando.
      - TAG=$(echo "$CODEBUILD_RESOLVED_SOURCE_VERSION" | cut -c1-12)
      - IMAGEM="$ECR_REPOSITORY_URI:$TAG"
      - echo "Imagem que será publicada - $IMAGEM"
      # Login no ECR com as credenciais TEMPORÁRIAS da role do CodeBuild
      # (não existe access key guardada em lugar nenhum).
      # ${ECR_REPOSITORY_URI%%/*} = só o endereço do registry, sem o nome do repositório.
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "${ECR_REPOSITORY_URI%%/*}"

  build:
    on-failure: ABORT
    commands:
      # A pasta backend/ é o "contexto" do build: o Dockerfile só enxerga ela.
      - docker build -t "$IMAGEM" backend/
      # Trivy: reprova só CVE CRÍTICA que JÁ TEM correção (--ignore-unfixed).
      # CVE sem correção não tem o que fazer agora; fica no relatório.
      - >-
        trivy image --no-progress
        --db-repository public.ecr.aws/aquasecurity/trivy-db:2
        --severity CRITICAL --ignore-unfixed --exit-code 1
        "$IMAGEM"
      - docker push "$IMAGEM"
      - printf '[{"name":"%s","imageUri":"%s"}]' "$CONTAINER_NAME" "$IMAGEM" > imagedefinitions.json
      - cat imagedefinitions.json

artifacts:
  files:
    - imagedefinitions.json
