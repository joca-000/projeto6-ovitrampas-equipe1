# =====================================================================
# Portão 1 - Fitness functions de SEGURANÇA (AWS Well-Architected SEC11-BP02)
# Projeto CodeBuild: ovitrampas-seguranca
#
# Cada ferramenta olha uma "superfície" diferente:
#   gitleaks  -> segredos (senhas, chaves, tokens) em TODO o histórico do Git
#   pip-audit -> dependências Python com vulnerabilidade conhecida (SCA)
#   Bandit    -> padrões inseguros no NOSSO código Python (SAST)
# Se qualquer comando terminar com erro, a ação fica vermelha e o pipeline para.
# =====================================================================
version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      # Versão FIXA do gitleaks (a mesma do kit da Aula 14). Nunca "latest":
      # tudo o que o buildspec baixa roda com as permissões da role do CodeBuild.
      - curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar xz -C /usr/local/bin gitleaks
      - pip install --quiet pip-audit==2.10.1 bandit==1.9.4

  build:
    commands:
      # --- gitleaks ---------------------------------------------------------
      # Precisa do histórico completo (opção "Full clone" na origem do pipeline).
      - git config --global --add safe.directory "$CODEBUILD_SRC_DIR"
      - git fetch --unshallow --quiet || true
      # --redact: se achar um segredo, mostra no log só o "formato", nunca o valor.
      - gitleaks git . --redact --verbose

      # --- pip-audit --------------------------------------------------------
      # Instala as dependências da API num ambiente isolado e consulta a base
      # de vulnerabilidades conhecidas. Termina com erro se achar alguma.
      - pip-audit -r backend/requirements.txt

      # --- Bandit -----------------------------------------------------------
      # Só o código da aplicação (backend/app), fora dos testes.
      # -ll = só severidade MÉDIA ou ALTA reprova o build.
      - bandit -r backend/app -ll
